# Manuell gepflegte Firmen und Forschungseinrichtungen.
#
# Seed-Einträge werden immer bewertet (sie überspringen den Stichwort-Filter der Stufe 1)
# und erscheinen auf der Karte, sobald ihr Score die Schwelle aus config.yaml erreicht.
#
# Felder:
#   name       (Pflicht)  Name der Firma/Einrichtung
#   address    (optional) Adresse für die Geokodierung; sonst wird "name, city" gesucht
#   city       (optional) Ort
#   lat, lon   (optional) Koordinaten; dann wird nicht geokodiert
#   website    (optional)
#   notes      (optional) eigene Notizen, fließen in die Bewertung ein
#   tags       (optional) Stichwörter, fließen in die Bewertung ein
#   score      (optional) feste Bewertung 0-10 statt automatischer Bewertung
#   reason     (optional) Begründung zur festen Bewertung
#   aliases    (optional) andere Namen derselben Firma in OSM, Wikidata oder Stellenanzeigen;
#              solche Einträge werden mit diesem zusammengeführt
#
# Seed-Einträge erscheinen immer auf der Karte, auch unterhalb der Score-Schwelle.
#
# Beispiele, bitte nach Belieben ergänzen oder löschen:

