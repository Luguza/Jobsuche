# Voraussetzung: Settings → Pages → Source „GitHub Actions“.
# Optional: Secret ANTHROPIC_API_KEY für die Bewertung per Claude (sonst Stichwort-Score).
name: Daten aktualisieren & Karte veröffentlichen

on:
  schedule:
    # Montag 04:15 UTC = 06:15 Uhr Sommerzeit / 05:15 Uhr Winterzeit
    - cron: "15 4 * * 1"
  workflow_dispatch:
    inputs:
      skip_update:
        description: "Nur die Karte neu bauen (keine neuen Daten abfragen)"
        type: boolean
        default: false

permissions:
  contents: write   # Daten-Commit
  pages: write      # GitHub Pages
  id-token: write   # GitHub Pages

concurrency:
  group: jobmap-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Daten aktualisieren
        if: ${{ !inputs.skip_update }}
        env:
          # Optional: ohne dieses Secret wird per Stichwort bewertet.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m jobmap update

      - name: Datenänderungen committen
        if: ${{ !inputs.skip_update }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Datenänderungen."
          else
            git commit -m "Daten-Update $(date -u +%F)"
            git push
          fi

      - name: Karte bauen
        run: python -m jobmap build --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
